
name: Flask CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  tests:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[async,dotenv]" pytest

      - name: Run all tests
        run: |
          python -m pytest tests/ -v

  build-and-run:
    name: Build and run Flaskr
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel and source distribution
        run: |
          python -m build --wheel --sdist

      - name: Create virtual environment
        run: |
          python -m venv flaskr-env

      - name: Install Flask from built wheel
        run: |
          flaskr-env/bin/python -m pip install dist/*.whl

      - name: Install Flaskr application
        run: |
          flaskr-env/bin/python -m pip install --no-deps ./examples/tutorial

      - name: Check installed Flask version
        run: |
          flaskr-env/bin/python -c "import flask; print('Flask version:', flask.__version__)"

      - name: Initialize Flaskr database
        run: |
          flaskr-env/bin/flask --app flaskr init-db

      - name: Start Flaskr on port 5000
        run: |
          nohup flaskr-env/bin/flask --app flaskr run \
            --host 127.0.0.1 \
            --port 5000 > flaskr.log 2>&1 &

      - name: Check Flaskr application
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:5000/hello; then
              echo "Flaskr successfully started on port 5000"
              exit 0
            fi
            sleep 1
          done

          cat flaskr.log
          echo "Flaskr failed to start"
          exit 1
